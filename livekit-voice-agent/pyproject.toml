[project]
name = "livekit-voice-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.3",
    "livekit-plugins-anthropic~=1.3",
    "livekit-plugins-assemblyai~=1.3",
    "livekit-plugins-cartesia~=1.3",
    "livekit-plugins-google~=1.3",
    "livekit-plugins-openai~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.2.1",
    # livekit-plugins-anthropic hands the SDK an httpx client; anthropic 1.x
    # moved to httpx2 and rejects it
    "anthropic<1",
]
